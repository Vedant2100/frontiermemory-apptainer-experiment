agents:
  - name: opencode
    model_name: ollama/qwen3-coder:30b
    kwargs:
      version: 1.19.4
      opencode_config:
        $schema: https://opencode.ai/config.json
        model: ollama/qwen3-coder:30b
        provider:
          ollama:
            npm: "@ai-sdk/openai-compatible"
            name: Ollama
            options:
              baseURL: http://127.0.0.1:11434/v1
            models:
              "qwen3-coder:30b":
                name: "qwen3-coder:30b"
                limit:
                  context: 32768
                  output: 8192
        permission:
          read: allow
          edit: allow
          bash: allow
          external_directory: deny
          webfetch: deny
          websearch: deny
          task: deny
          doom_loop: deny
    env:
      PATH: "/staging/env_files/shims:/staging/env_files/opencode-runtime/node/bin:/staging/env_files/opencode-runtime/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      NPM_CONFIG_PREFIX: "/staging/env_files/opencode-runtime/npm"
      NPM_CONFIG_OFFLINE: "true"
      OPENCODE_LOG_LEVEL: "DEBUG"
      OPENCODE_PRINT_LOGS: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_CONFIG_CONTENT: >-
        {"$schema":"https://opencode.ai/config.json","model":"ollama/qwen3-coder:30b","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","name":"Ollama","options":{"baseURL":"http://127.0.0.1:11434/v1"},"models":{"qwen3-coder:30b":{"name":"qwen3-coder:30b","limit":{"context":32768,"output":8192}}}}},"permission":{"read":"allow","edit":"allow","bash":"allow","external_directory":"deny","webfetch":"deny","websearch":"deny","task":"deny","doom_loop":"deny"}}
